<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.json">
<title>JARVIS Mobile</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b14;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:720px;margin:auto;padding:22px 18px 36px}h1{font-size:34px;margin:10px 0 4px}.sub{color:#9aa6bb;margin:0 0 22px}
.card{background:#111827;border:1px solid #263246;border-radius:20px;padding:18px;margin:14px 0}
label{display:block;color:#b9c4d8;font-size:14px;margin:12px 0 7px}
input,textarea,button{font:inherit}input,textarea{width:100%;background:#0a0f1b;color:#fff;border:1px solid #334155;border-radius:14px;padding:14px;outline:none}
textarea{min-height:125px;resize:vertical}button{border:0;border-radius:14px;padding:14px 18px;font-weight:700;cursor:pointer}
.primary{width:100%;background:#2563eb;color:#fff;font-size:17px;margin-top:14px}.secondary{background:#1e293b;color:#fff;margin-top:10px}
.status{padding:12px;border-radius:12px;background:#0b1220;color:#b8c5da;margin-top:14px;white-space:pre-wrap}
.result{white-space:pre-wrap;line-height:1.5;background:#050914;border:1px solid #263246;border-radius:14px;padding:15px;min-height:80px}
.small{font-size:12px;color:#8491a7;line-height:1.5}.ok{color:#4ade80}.err{color:#fb7185}.row{display:flex;gap:10px}.row>*{flex:1}
</style></head>
<body><main>
<h1>🤖 JARVIS</h1><p class="sub">Mobile AI Assistant • GitHub Actions powered</p>
<div class="card"><label>GitHub Fine-grained Token</label>
<input id="token" type="password" placeholder="github_pat_...">
<p class="small">Token केवल इस page की memory में रहता है; इसे किसी को share न करें.</p></div>
<div class="card"><label>JARVIS को क्या काम करना है?</label>
<textarea id="task" placeholder="उदाहरण: Jaunpur horticulture ki monthly report ka draft banao"></textarea>
<button class="primary" id="run">🚀 JARVIS चलाएँ</button><div id="status" class="status">Ready.</div></div>
<div class="card"><label>JARVIS का जवाब</label><div id="result" class="result">अभी कोई जवाब नहीं आया।</div></div>
<div class="card"><p><b>Quick commands</b></p><div class="row">
<button class="secondary" data-task="एक PDF report का draft बनाओ">📄 PDF</button>
<button class="secondary" data-task="Excel data calculation करो">📊 Excel</button></div>
<div class="row"><button class="secondary" data-task="इस विषय पर research करो">🔎 Research</button>
<button class="secondary" data-task="एक application form तैयार करो">📝 Form</button></div></div>
<p class="small">JARVIS repository: -jarvis-agent</p>
</main>
<script>
const OWNER="ashubhaiyasingh-lgtm",REPO="-jarvis-agent",WORKFLOW="jarvis.yml";
const token=document.getElementById("token"),task=document.getElementById("task"),status=document.getElementById("status"),result=document.getElementById("result");
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function msg(t,c=""){status.textContent=t;status.className="status "+c}
async function api(url,opt={}){
 const h=Object.assign({"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},opt.headers||{});
 h.Authorization="Bearer "+token.value.trim();
 const r=await fetch(url,{...opt,headers:h}); const t=await r.text(); let d={}; try{d=JSON.parse(t)}catch{}
 if(!r.ok)throw Error(d.message||("GitHub API error "+r.status)); return d;
}
async function run(){
 if(!token.value.trim())return msg("पहले GitHub token डालें.","err");
 if(!task.value.trim())return msg("पहले अपना काम लिखें.","err");
 result.textContent="JARVIS काम कर रहा है…";
 try{
  msg("1/3 Workflow शुरू हो रहा है…");
  await api(`https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/dispatches`,{
   method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({ref:"main",inputs:{task:task.value.trim()}})
  });
  await wait(2500);msg("2/3 JARVIS process हो रहा है…");
  let run=null;
  for(let i=0;i<20;i++){
   const d=await api(`https://api.github.com/repos/${OWNER}/${REPO}/actions/runs?workflow_id=${WORKFLOW}&per_page=10`);
   const a=(d.workflow_runs||[]).filter(x=>x.event==="workflow_dispatch");
   if(a.length){run=a[0];break} await wait(2500);
  }
  if(!run)throw Error("Workflow run नहीं मिला.");
  for(let i=0;i<60;i++){
   const r=await api(`https://api.github.com/repos/${OWNER}/${REPO}/actions/runs/${run.id}`);
   if(r.status==="completed"){
    if(r.conclusion!=="success")throw Error("Workflow "+r.conclusion);
    msg("3/3 पूरा हो गया ✓","ok");
    result.textContent="Workflow सफल हुआ। GitHub Actions में run खोलकर JARVIS output देखें.";
    return;
   } await wait(3000);
  }
  throw Error("JARVIS को पूरा होने में बहुत समय लग रहा है.");
 }catch(e){msg(e.message||String(e),"err");result.textContent="";}
}
document.getElementById("run").onclick=run;
document.querySelectorAll("[data-task]").forEach(b=>b.onclick=()=>task.value=b.dataset.task);
</script></body></html>
